name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      opensearch:
        image: opensearchproject/opensearch:2.11.1
        env:
          discovery.type: single-node
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200 >/dev/null || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      RAILS_ENV: test
      CI: true
      DB_HOST: localhost
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-jwt-secret
      SECRET_KEY_BASE: ci-secret-key-base-for-test-suite-only
      SESSION_SECRET_TOKEN: ci-session-secret
      ANYCABLE_SECRET: ci-anycable-secret
      MAILER_ADDRESS: 127.0.0.1
      MAILER_PORT: 1025
      MAILER_USER_NAME: ci@example.com
      MAILER_PASSWORD: ""
      MAILER_DOMAIN: localhost
      MAILER_HOST: localhost

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: true

      - name: Prepare database
        run: bin/rails db:create db:schema:load

      - name: Run Brakeman
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error

      - name: Run bundler-audit
        run: bin/bundler-audit check --update

      - name: Run RuboCop
        run: bin/rubocop

      - name: Run specs
        run: bundle exec rspec

      - name: Check OpenAPI drift
        run: bundle exec rake openapi:drift_check

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/.resultset.json
          flags: api
          name: ubuteco-api
          fail_ci_if_error: false

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
