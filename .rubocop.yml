inherit_from: .rubocop_todo.yml

Rails:
  Enabled: true

require:
  - rubocop-rails
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-factory_bot

AllCops:
  TargetRubyVersion: 4.0.1
  NewCops: enable
  Exclude:
    - 'bin/*'
    - 'vendor/**/*'
    - '**/vendor/**/*'
    - 'actionpack/lib/action_dispatch/journey/parser.rb'
    - 'db/schema.rb'
    - 'db/migrate/*'
    - 'config/initializers/*'
    - 'config/environments/*'
    - 'lib/tasks/populate.rake'
    - 'lib/tasks/demo_orders.rake'
    - 'config/routes.rb'
    - 'spec/**/*.rb'

Style/Documentation:
  Enabled: false
Style/ClassAndModuleChildren:
  Enabled: true
Rails/EnvironmentVariableAccess:
  Enabled: false
Metrics/AbcSize:
  AllowedMethods:
    - load_permissions
Metrics/CyclomaticComplexity:
  AllowedMethods:
    - load_permissions
Metrics/MethodLength:
  AllowedMethods:
    - load_permissions
