test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# S3-compatible object storage (T3, AWS, MinIO, etc.). Set AWS_* env vars in production.
amazon:
  service: S3
  access_key_id: <%= ENV["AWS_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["AWS_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("AWS_REGION", "auto") %>
  bucket: <%= ENV.fetch("AWS_BUCKET", "") %>
  endpoint: <%= ENV["AWS_ENDPOINT_URL"] if ENV["AWS_ENDPOINT_URL"].present? %>
  force_path_style: <%= ENV.fetch("AWS_S3_FORCE_PATH_STYLE", "true") == "true" %>
